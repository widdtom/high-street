# =============================================================================
# Build High Street and publish it to GitHub Pages.
#
# Result lives at https://widdtom.github.io/high-street/ — which is why
# vite.config.ts pins `base: '/high-street/'`. If the repository is ever
# renamed, that base, the manifest scope/start_url and the service worker
# scope all have to move together or the PWA will stop installing.
#
# Enable once in the repo: Settings -> Pages -> Build and deployment ->
# Source: "GitHub Actions".
# =============================================================================
name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  # Lets you re-deploy the current main without an empty commit.
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# One live deployment at a time. Queued runs wait rather than cancel, so a
# deploy that is already uploading is never killed half-way.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm run test

      - name: Build
        run: npm run build

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./dist

  deploy:
    name: Deploy
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
